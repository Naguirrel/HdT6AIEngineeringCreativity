description: Parachute S.A. centralized supervisor evaluations
env:
  REQUEST_TIMEOUT_MS: 45000
prompts:
  - '{{ turns }}'
providers:
  - id: file://provider.py
    label: Central Supervisor
defaultTest:
  options:
    disableVarExpansion: true
    provider:
      id: 'openai:chat:{{ env.LLM_GRADER_MODEL }}'
      config:
        apiBaseUrl: '{{ env.LLM_BASE_URL }}'
        apiKeyEnvar: LLM_API_KEY
        maxRetries: 0
        omitDefaults: true
        showThinking: false
  assert:
    - type: latency
      threshold: 180000
tests:
  - file://faq_scenarios.yaml
  - file://appointment_scenarios.yaml
