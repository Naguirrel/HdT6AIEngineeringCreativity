- description: FAQ lugar y fecha del evento
  vars:
    scenario: faq_place_date
    turns: ["¿Cuándo y dónde se realizará el evento de paracaidismo?"]
    expect_tools: [search_faq]
    forbid_tools: [check_jump_day, check_appointment_availability, create_appointment]
    min_retrieved_context: 1
  assert:
    - type: contains
      value: '29 de septiembre de 2026'
    - type: regex
      value: 'Puerto\s+San\s*Jos'
    - type: python
      value: file://assertions/tool_trace.py
    - type: factuality
      value: 'El evento será el 29 de septiembre de 2026 en la Pista de Aterrizaje de Puerto San José, Escuintla, Guatemala, a partir de las 07:00 AM.'
    - {type: latency, threshold: 60000}
