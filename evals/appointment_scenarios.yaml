- description: Orden completo del flujo con cita individual
  vars:
    scenario: appointment_full_order
    turns: ["Necesito una cita para el 2026-09-20: Beatriz Prueba, beatriz@example.invalid, 1 persona."]
    weather_fixture: ideal
    expect_tools: [check_jump_day, check_appointment_availability, create_appointment]
    expect_tool_order: [check_jump_day, check_appointment_availability, create_appointment]
    expect_customer_name: Beatriz Prueba
    expect_contact: beatriz@example.invalid
    require_assessed_before_create: true
    expect_tool_events:
      - {tool: check_appointment_availability, arguments: {date_str: '2026-09-20'}, result: {available: true}, status: success}
      - {tool: create_appointment, arguments: {party_size: 1}, result: {created: true}, status: success}
  assert:
    - {type: contains, value: '2026-09-20'}
    - {type: python, value: 'file://assertions/tool_trace.py'}
