  vars:
    scenario: appointment_info_only
    turns: ["¿Cómo puedo comprar un boleto o reservar mi cupo para el evento?"]
    expect_tools: [search_faq]
    forbid_tools: [check_jump_day, check_appointment_availability, create_appointment]
