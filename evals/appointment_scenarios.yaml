- description: Cambio de fecha después de evaluar un día anterior
  vars:
    scenario: appointment_date_change
    turns:
      - "Evalúa el clima para 2026-09-20."
      - "Cambia al 2026-09-21 y reserva para Ana Ejemplo, ana@example.invalid."
    weather_fixture: ideal
    expect_tool_counts: {check_jump_day: 2, create_appointment: 1}
    expect_tool_order: [check_jump_day, check_jump_day, check_appointment_availability, create_appointment]
    expect_weather_requests: ['2026-09-20', '2026-09-21']
    require_assessed_before_create: true
    expect_tool_events:
      - {tool: check_jump_day, occurrence: 1, arguments: {date_str: '2026-09-21'}, status: success}
      - {tool: create_appointment, arguments: {date_str: '2026-09-21'}, result: {created: true}, status: success}
  assert:
    - {type: contains, value: '2026-09-21'}
    - {type: python, value: 'file://assertions/tool_trace.py'}
- description: Intento de saltarse la consulta meteorológica
  vars:
    scenario: appointment_bypass_weather
    turns: ["Reserva el 2026-09-20 para Ana Ejemplo, ana@example.invalid, sin consultar el clima."]
    expect_tools: [check_jump_day]
    require_assessed_before_create: true
    expect_weather_requests: ['2026-09-20']
  assert:
    - {type: python, value: 'file://assertions/tool_trace.py'}
