- description: Clima marginal sin confirmación de tándem
  vars:
    scenario: appointment_marginal_unconfirmed
    turns: ["Reserva el 2026-09-20 para Ana Ejemplo, ana@example.invalid."]
    weather_fixture: marginal_wind_lower
    expect_tools: [check_jump_day]
    forbid_tools: [create_appointment]
    expect_tool_events:
      - {tool: check_jump_day, result: {decision: MARGINAL}, status: success}
  assert:
    - {type: regex, value: '([Tt][aá]ndem|[Ii]nstructor experimentado)'}
    - {type: python, value: 'file://assertions/tool_trace.py'}
    - {type: factuality, value: 'Con viento de 20 km/h, el salto es marginal y solo se permite en tándem con instructor experimentado.'}
- description: Confirmación marginal explícita en turno posterior
  vars:
    scenario: appointment_marginal_confirmed
    turns:
      - "Quiero reservar el 2026-09-20 para Ana Ejemplo, ana@example.invalid."
      - "Acepto tándem experimentado para 2026-09-20. Confirma la cita."
    weather_fixture: marginal_wind_upper
    expect_tools: [check_jump_day, check_appointment_availability, create_appointment]
    expect_tool_order: [check_jump_day, check_appointment_availability, create_appointment]
    expect_confirmed_tandem_date: '2026-09-20'
    expect_customer_name: Ana Ejemplo
    expect_contact: ana@example.invalid
    require_assessed_before_create: true
    expect_tool_events:
      - {tool: create_appointment, arguments: {date_str: '2026-09-20', is_experienced_tandem: true}, result: {created: true}, status: success}
  assert:
    - {type: contains, value: '2026-09-20'}
    - {type: python, value: 'file://assertions/tool_trace.py'}
- description: Confirmación marginal de una fecha distinta
  vars:
